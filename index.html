<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مناحل الزهور – عسل نحل طبيعي نقي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4D6;--bg2:#FFE9AE;--card:#FFFDF4;--ink:#3B2A12;--soft:#6B4F25;--acc:#8A5410;--gold:#F2B01E;--deep:#3B2A12;--on-deep:#FFF4D6;--sky1:#BFE6FF;--sky2:#FFF3C4;--hill1:#7DB35A;--hill2:#5B9A45;--line:rgba(138,84,16,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E160D;--bg2:#2A1E10;--card:#2C2114;--ink:#FBEBC9;--soft:#D9BF8A;--acc:#F2B01E;--deep:#120C06;--on-deep:#FFF4D6;--sky1:#35506B;--sky2:#6B5A33;--hill1:#4F7F3C;--hill2:#3A6A2E;--line:rgba(242,176,30,.28)}}
:root[data-theme="dark"]{--bg:#1E160D;--bg2:#2A1E10;--card:#2C2114;--ink:#FBEBC9;--soft:#D9BF8A;--acc:#F2B01E;--deep:#120C06;--on-deep:#FFF4D6;--sky1:#35506B;--sky2:#6B5A33;--hill1:#4F7F3C;--hill2:#3A6A2E;--line:rgba(242,176,30,.28)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;overflow-x:hidden}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.hexbg{position:fixed;inset:0;z-index:0;opacity:.5;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97'><path d='M28 2 54 17v31L28 63 2 48V17z' fill='none' stroke='%23F2B01E' stroke-opacity='.35' stroke-width='2'/><path d='M28 63v32M2 79l26 16 26-16' fill='none' stroke='%23F2B01E' stroke-opacity='.35' stroke-width='2'/></svg>")}
.bee{position:fixed;z-index:25;width:46px;height:34px;pointer-events:none;left:-80px;top:0;will-change:transform}
.bee svg{width:100%;height:100%;overflow:visible}
.wing{transform-origin:50% 60%;animation:flap .12s infinite alternate ease-in-out}
@keyframes flap{from{transform:rotate(-18deg) scaleY(1)}to{transform:rotate(14deg) scaleY(.55)}}
.b1{top:14vh;animation:f1 22s linear infinite}
.b2{top:42vh;width:36px;animation:f2 30s linear infinite 4s}
.b3{top:70vh;width:52px;animation:f3 26s linear infinite 9s}
.b5{top:55vh;width:40px;animation:f3 38s linear infinite 14s}
.b4{top:28vh;width:30px;animation:f4 34s linear infinite 2s}
@keyframes f1{0%{transform:translate(-10vw,0)}25%{transform:translate(28vw,-40px) rotate(-8deg)}50%{transform:translate(55vw,30px) rotate(6deg)}75%{transform:translate(82vw,-30px) rotate(-6deg)}100%{transform:translate(115vw,10px)}}
@keyframes f2{0%{transform:translate(115vw,0) scaleX(-1)}30%{transform:translate(70vw,50px) scaleX(-1) rotate(8deg)}60%{transform:translate(35vw,-30px) scaleX(-1) rotate(-8deg)}100%{transform:translate(-15vw,20px) scaleX(-1)}}
@keyframes f3{0%{transform:translate(-10vw,20px)}35%{transform:translate(40vw,-60px) rotate(-10deg)}70%{transform:translate(75vw,40px) rotate(8deg)}100%{transform:translate(115vw,-20px)}}
@keyframes f4{0%{transform:translate(115vw,0) scaleX(-1)}50%{transform:translate(50vw,-70px) scaleX(-1) rotate(10deg)}100%{transform:translate(-15vw,30px) scaleX(-1)}}
header.hero{position:relative;z-index:2;text-align:center;padding:56px 20px 70px;background:linear-gradient(180deg,var(--deep) 0,var(--deep) 78%,transparent 100%);color:var(--on-deep);overflow:hidden}
.drips{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;justify-content:space-around;align-items:flex-start;pointer-events:none}
.drips i{display:block;width:16px;height:30px;background:var(--gold);border-radius:0 0 12px 12px;transform-origin:top;animation:drip 4s ease-in-out infinite}
.drips i:nth-child(2n){animation-delay:1.2s;width:12px}.drips i:nth-child(3n){animation-delay:2.1s;width:20px}
@keyframes drip{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.7)}}
.hero h1{margin:0;font-size:clamp(46px,11vw,96px);font-weight:900;line-height:1.15;color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.35);animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both,glow 3s 1s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 26px rgba(242,176,30,.75)}}
.hero .sub{font-size:clamp(22px,5vw,34px);font-weight:700;margin-top:6px;animation:rise .9s .15s both}
.hero .rule{width:min(260px,60%);height:3px;margin:18px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform-origin:center;animation:grow 1s .35s both}
.hero .pct{font-size:clamp(54px,13vw,104px);font-weight:900;line-height:1;direction:ltr;animation:pop 1s .5s both}
.hero .eng{margin-top:8px;font-size:clamp(17px,4vw,26px);letter-spacing:.14em;direction:ltr;font-weight:600;color:#F5DFA5;animation:rise .9s .7s both}
.hero .bhex{position:absolute;opacity:.16;width:150px;animation:spin 40s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:18px 16px 30px}
.secT{text-align:center;font-size:clamp(24px,5vw,34px);font-weight:900;color:var(--acc);margin:6px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 22px rgba(60,40,10,.14);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .35s,opacity .6s;opacity:0;transform:translateY(40px)}
.card.in{opacity:1;transform:none}
.card.in:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 18px 34px rgba(60,40,10,.25)}
.card:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.card.in:active{transform:scale(.96)}

.scene .rays{position:absolute;inset:0;background:conic-gradient(from 150deg at 35% 18%,transparent 0 6%,rgba(255,244,180,.32) 8%,transparent 11% 17%,rgba(255,244,180,.22) 19%,transparent 23% 30%,rgba(255,244,180,.26) 32%,transparent 36% 100%);mix-blend-mode:screen;transform-origin:35% 18%;animation:rays 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes rays{from{opacity:.45;transform:rotate(-5deg)}to{opacity:1;transform:rotate(6deg)}}
.scene .shd{position:absolute;left:49.5%;bottom:17.2%;width:36%;height:5%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(0,0,0,.5),transparent 70%);animation:shd 4.5s ease-in-out infinite}
@keyframes shd{50%{transform:translateX(-50%) scale(.88);opacity:.7}}
.scene img.pr{position:absolute;left:49.5%;bottom:19.4%;transform:translateX(-50%);max-width:46%;max-height:57%;width:auto;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transform-origin:50% 100%;animation:float 4.5s ease-in-out infinite;transition:filter .4s}
@keyframes float{50%{transform:translateX(-50%) translateY(-6px)}}
.card .scene img.pr{opacity:0}
.card.in .scene img.pr{opacity:1;animation:drop .9s cubic-bezier(.3,1.6,.5,1) both,float 4.5s 1s ease-in-out infinite}
@keyframes drop{0%{opacity:0;transform:translateX(-50%) translateY(-120px) scale(.9)}60%{opacity:1}100%{transform:translateX(-50%) translateY(0) scale(1)}}
.card:hover .scene img.pr{filter:drop-shadow(0 6px 6px rgba(0,0,0,.35)) drop-shadow(0 0 16px rgba(255,214,90,.9))}
.scene .pol{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.pol i{position:absolute;bottom:20%;width:7px;height:7px;border-radius:50%;background:#FFE27A;box-shadow:0 0 8px #FFD34D;opacity:0;animation:pol 6s linear infinite}
@keyframes pol{0%{opacity:0;transform:translate(0,0)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx,20px),-250px)}}
.pol i:nth-child(1){left:20%;--dx:30px}.pol i:nth-child(2){left:38%;animation-delay:1.5s;--dx:-20px}.pol i:nth-child(3){left:62%;animation-delay:3s;--dx:25px}.pol i:nth-child(4){left:80%;animation-delay:4.2s;--dx:-30px}
.card .nm{padding:14px 14px 6px;font-size:19px;font-weight:700;text-align:center;color:var(--ink);min-height:3.4em;display:grid;place-items:center}
.card .btn{margin:6px 14px 16px;padding:10px 12px;border-radius:999px;background:var(--gold);color:#3B2A12;font-weight:800;text-align:center;font-size:17px;transition:background .3s,letter-spacing .3s}
.card:hover .btn{background:#FFC83D;letter-spacing:.03em}
footer{position:relative;z-index:2;background:var(--deep);color:var(--on-deep);margin-top:20px;padding:34px 18px calc(30px + env(safe-area-inset-bottom,0px))}
footer .row{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}
footer .box{border:2px dashed var(--gold);border-radius:20px;padding:18px;text-align:center;font-size:19px;font-weight:600}
footer .disc{display:grid;place-items:center;font-size:clamp(24px,5vw,34px);font-weight:900;color:var(--gold);background:rgba(242,176,30,.1)}
footer .tel{display:block;text-align:center;margin:24px auto 0;font-size:clamp(30px,8vw,52px);font-weight:900;color:var(--gold);text-decoration:none;direction:ltr;animation:ring 2.4s ease-in-out infinite}
footer .tel small{display:block;font-size:17px;color:var(--on-deep);font-weight:600}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(max-width:620px){footer .row{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card .nm{font-size:16px;padding:10px 8px 4px}.card .btn{font-size:15px;margin:4px 10px 12px}}
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;visibility:hidden;clip-path:circle(0 at 50% 50%);transition:clip-path .7s cubic-bezier(.6,.05,.2,1),visibility 0s .7s;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.detail.open{visibility:visible;transition:clip-path .7s cubic-bezier(.6,.05,.2,1)}
.wipe{position:fixed;inset:0;z-index:39;background:radial-gradient(circle at 30% 30%,#FFD34D,#E59A0B);clip-path:circle(0 at 50% 50%);visibility:hidden;pointer-events:none}
.wipe.go{visibility:visible;animation:wipe .9s ease-in-out forwards}
@keyframes wipe{0%{clip-path:circle(0 at var(--x) var(--y))}55%{clip-path:circle(150% at var(--x) var(--y));opacity:1}100%{clip-path:circle(150% at var(--x) var(--y));opacity:0;visibility:hidden}}
.dwrap{max-width:900px;margin:0 auto}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--deep);color:var(--on-deep);padding:10px 20px;border-radius:999px;font-weight:800;font-size:17px}
.back:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.dscene{margin:16px auto;border-radius:26px;width:100%;max-width:560px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.dh{font-size:clamp(28px,6vw,44px);font-weight:900;color:var(--acc);margin:6px 0 4px;text-align:center}
.pill{display:block;width:max-content;margin:0 auto 16px;background:var(--gold);color:#3B2A12;border-radius:999px;padding:4px 18px;font-weight:800}
.intro{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:14px;font-size:18px}
.ben{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ben li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 52px 13px 16px;position:relative;font-size:18px;opacity:0;transform:translateX(30px)}
.ben li:before{content:"";position:absolute;right:14px;top:16px;width:24px;height:24px;background:var(--gold);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.ben li b{display:block;color:var(--acc);font-size:19px}
.detail.open .dscene img.pr{animation:drop 1s .45s cubic-bezier(.3,1.6,.5,1) both,float 4.5s 1.5s ease-in-out infinite}
.detail .dscene img.pr{opacity:1}
.detail.open .ben li{animation:slidein .5s forwards}
@keyframes slidein{to{opacity:1;transform:none}}
.soon{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;font-size:18px}
.dcall{display:block;text-align:center;margin:22px auto 0;background:var(--deep);color:var(--gold);text-decoration:none;font-weight:900;font-size:24px;border-radius:999px;padding:12px 20px;max-width:380px;direction:ltr}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.bee{display:none}.ben li{opacity:1;transform:none}}

var grid=document.getElementById('grid'),det=document.getElementById('detail'),dw=document.getElementById('dwrap'),lastPt=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function scene(i,cls){return '<div class="scene '+(cls||'')+'"><div class="rays"></div><div class="pol"><i></i><i></i><i></i><i></i></div><div class="shd"></div><img class="pr" alt="'+esc(D[i].n)+'" src="'+D[i].i+'"></div>'}
D.forEach(function(p,i){
 var b=document.createElement('button');b.className='card';b.style.transitionDelay='0s';b.setAttribute('aria-label',p.n+' – اعرف الفوايد');
 b.innerHTML=scene(i)+'<div class="nm">'+esc(p.n)+'</div><div class="btn">اعرف الفوايد</div>';
 b.addEventListener('click',function(e){var r=b.getBoundingClientRect();lastPt=[r.left+r.width/2,r.top+r.height/2];try{location.hash='p'+i}catch(x){openD(i)}});
 grid.appendChild(b);
});
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var c=e.target;setTimeout(function(){c.classList.add('in')},(Array.prototype.indexOf.call(grid.children,c)%4)*120);io.unobserve(c)}})},{threshold:.15}):null;
Array.prototype.forEach.call(grid.children,function(c){if(io)io.observe(c);else c.classList.add('in')});
function benefits(p){
 if(!p.b||(Array.isArray(p.b)&&!p.b.length))return '<div class="soon">تفاصيل هذا المنتج سيتم إضافتها قريبًا. للاستفسار تواصل معنا على الرقم بالأسفل.</div>';
 var items=Array.isArray(p.b)?p.b:p.b.items,h='';
 if(p.b.intro)h+='<div class="intro">'+esc(p.b.intro)+'</div>';
 h+='<ul class="ben">'+items.map(function(t,k){var s=t.split('|');var x=s.length>1?'<b>'+esc(s[0])+'</b>'+esc(s[1]):esc(t);return '<li style="animation-delay:'+(.45+k*.09)+'s">'+x+'</li>'}).join('')+'</ul>';
 return h;
}
function openD(i,instant){
 var p=D[i];
 dw.innerHTML='<button class="back" id="bk">→ رجوع للمنيو</button>'+scene(i,'dscene')+'<h2 class="dh">'+esc(p.n)+'</h2><span class="pill">'+(p.t==='عسل'?'عسل طبيعي':'من مناحل الزهور')+'</span>'+benefits(p)+'<a class="dcall" href="tel:01203344188">01203344188</a>';
 document.getElementById('bk').onclick=closeD;
 var pt=lastPt||[innerWidth/2,innerHeight/2];
 det.style.transition='none';det.style.clipPath='circle(0 at '+pt[0]+'px '+pt[1]+'px)';det.classList.remove('open');det.scrollTop=0;
 void det.offsetWidth;det.style.transition='';
 var wp=document.getElementById('wipe');if(!instant){wp.style.setProperty('--x',pt[0]+'px');wp.style.setProperty('--y',pt[1]+'px');wp.classList.remove('go');void wp.offsetWidth;wp.classList.add('go')}
 det.classList.add('open');det.setAttribute('aria-hidden','false');
 det.style.clipPath=instant?'circle(150% at 50% 50%)':'circle(150% at '+pt[0]+'px '+pt[1]+'px)';
 document.body.classList.add('lock');setTimeout(function(){var b=document.getElementById('bk');if(b)b.focus({preventScroll:true})},500);
}
function closeD(){
 if(location.hash){try{location.hash=''}catch(x){hideD()}}else hideD();
}
function hideD(){
 var pt=lastPt||[innerWidth/2,innerHeight/2];
 det.style.clipPath='circle(0 at '+pt[0]+'px '+pt[1]+'px)';det.classList.remove('open');det.setAttribute('aria-hidden','true');
 document.body.classList.remove('lock');
}
function route(first){
 var m=/^#p(\d+)$/.exec(location.hash||'');
 if(m&&D[+m[1]])openD(+m[1],first);else if(det.classList.contains('open'))hideD();
}
addEventListener('hashchange',function(){route(false)});
addEventListener('keydown',function(e){if(e.key==='Escape')closeD()});
route(true);
